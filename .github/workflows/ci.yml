name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    steps:
      - name: Preserve exact pinned source and frozen artifact bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Verify installed dependency consistency
        run: python -m pip check
      - name: Reject high-risk static errors
        run: ruff check app.py novel_ai scripts tests --select E9,F63,F7,F82
      - name: Report default Ruff maintenance baseline
        run: |
          ruff check app.py novel_ai scripts tests --output-format json --exit-zero > ruff-default.json
          python -c "import collections,json; rows=json.load(open('ruff-default.json',encoding='utf-8')); counts=collections.Counter(row['code'] for row in rows); print('Default Ruff diagnostics:',len(rows)); print('Top rules:',dict(counts.most_common(12)))"
      - run: python -m compileall app.py novel_ai scripts
      - name: Report optional integration availability
        run: python scripts/check_integrations.py
      - name: Check current public entry
        run: python scripts/check_current_entry.py
      - run: pytest -q

      - name: Exercise optional local trafilatura HTML path
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "trafilatura>=1.8.0,<3"
          python -m pip check
          python - <<'PY'
          import trafilatura
          assert callable(trafilatura.extract)
          print("trafilatura", trafilatura.__version__)
          PY
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          pytest -q tests/test_reading.py -k trafilatura -rs | tee "$work/pytest.log"
          grep -Eq '[1-9][0-9]* passed' "$work/pytest.log"
          if grep -Eq '[1-9][0-9]* skipped' "$work/pytest.log"; then
            echo "optional trafilatura tests unexpectedly skipped"
            exit 1
          fi
          pytest -q tests/test_reference_evidence.py -k optional_html -rs | tee "$work/evidence-pytest.log"
          grep -Eq '[1-9][0-9]* passed' "$work/evidence-pytest.log"
          if grep -Eq '[1-9][0-9]* skipped' "$work/evidence-pytest.log"; then
            echo "optional trafilatura evidence test unexpectedly skipped"
            exit 1
          fi

      - name: Exercise the real Streamlit entry
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          python -m streamlit run app.py --server.headless true --server.address 127.0.0.1 --server.port 8501 >"$work/streamlit.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; rm -rf "$work"' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8501/_stcore/health >"$work/health.txt"; then
              break
            fi
            sleep 1
          done
          test "$(tr -d '\r\n' <"$work/health.txt")" = "ok"
          curl -fsS http://127.0.0.1:8501/ >"$work/index.html"
          python - "$work" <<'PY'
          import json
          import pathlib
          import sys

          work = pathlib.Path(sys.argv[1])
          health = (work / "health.txt").read_text(encoding="utf-8").strip()
          html = (work / "index.html").read_text(encoding="utf-8").lower()
          assert health == "ok", health
          assert "<!doctype html>" in html
          print(json.dumps({
              "entry": "python -m streamlit run app.py",
              "health": health,
              "root": True,
          }, ensure_ascii=False))
          PY
